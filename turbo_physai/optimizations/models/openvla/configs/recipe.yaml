schema_version: turbophysai/optimization-config/v1
kind: OptimizationConfig

metadata:
  id: model.openvla.base.hcu
  version: "0.8.0"
  description: HCU optimization recipe for official OpenVLA

model:
  name: openvla

optimization_modules:
  - turbo_physai.optimizations.models.openvla.catalog

extends: []

compatibility: {}

optimization_groups:
  - id: openvla.bf16_support
    enabled: true

  - id: openvla.fsdp.prefetch
    enabled: true
    options:
      limit_all_gathers: false
      forward_prefetch: true
      backward_prefetch: pre

  - id: openvla.compile.fsdp1
    enabled: true
    options:
      compile: true
      mode: default

  - id: openvla.adamw.fused
    enabled: true

  - id: openvla.llm.skip_fa2_unpad
    enabled: true

  - id: openvla.data.text_len_bucket
    enabled: true
    options:
      bucket: 8

  - id: openvla.dataloader.spawn
    enabled: false
    options:
      num_workers: 2
      pin_memory: true

  - id: openvla.gc.freeze
    enabled: true

  - id: openvla.reproducibility.data_order
    enabled: true
    options:
      explicit_seeds: true
      hold_shuffle_permutation: true

  - id: openvla.reproducibility.determinism
    enabled: true
    options:
      cudnn_deterministic: true
      benchmark: false
      allow_tf32: false
      deterministic_algorithms: true
      strict: false
